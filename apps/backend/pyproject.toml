[project]
name = "reform-tax-backend"
version = "0.1.0"
description = "ReformaTax API - Citation-grounded Q&A for Brazilian Tax Reform"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
]

[project.optional-dependencies]
rag = [
    "redis",
    "chromadb",
    "groq",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
